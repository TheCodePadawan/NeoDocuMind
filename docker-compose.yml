services:
  api:
    build: .
    image: documind:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    command: uvicorn documind.api:app --host 0.0.0.0 --port 8000

  ui:
    image: documind:latest
    depends_on:
      - api
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
