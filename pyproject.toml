[project]
name = "documind"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation (RAG) assistant with hybrid search, reranking, citations, and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DocuMind" }]
keywords = ["rag", "llm", "langchain", "retrieval", "nlp", "machine-learning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "eval", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
